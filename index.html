<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Round Planner</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Round">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EDF1EF">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#EDF1EF; --surface:#F8FAF9; --ink:#10201F; --muted:#5B6967; --line:#D3DBD8;
  --accent:#123F45; --onaccent:#F3F7F6; --brass:#9A7B43;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0B1415; --surface:#121E1F; --ink:#E7EEEC; --muted:#8C9E9B; --line:#233435; --accent:#BFD8D3; --onaccent:#0B1415; --brass:#E0C98F}
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-top:max(18px, env(safe-area-inset-top, 0px));
  padding-bottom:calc(104px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font:400 38px/1 var(--display);margin:0;letter-spacing:-.01em}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-bottom:8px}
.label.row2{display:flex;justify-content:space-between;align-items:center}
.label button{border:0;background:none;color:var(--muted);font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:0}
#map{height:300px;border-radius:20px;border:1px solid var(--line);background:var(--surface);z-index:0}
.leaflet-container{font-family:var(--body)}
.leaflet-control-attribution{font-size:10px}
.pin{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font:700 12px var(--body);border:2px solid var(--bg);box-shadow:0 1px 5px rgba(0,0,0,.35)}
.pin.home{border-radius:8px;background:var(--brass);color:var(--bg)}
.pin.sm{width:14px;height:14px;font-size:0;border-width:2px}
.field{display:flex;flex-direction:column}
input[type=text],textarea{
  width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font:500 15px/1.5 var(--body);outline:none;resize:none;
}
textarea{min-height:52px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
input:focus-visible,textarea:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.addrow .btn{width:auto;min-width:84px}
.sugg{display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.sugg button{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;font:500 14px var(--body);padding:12px 16px;cursor:pointer;overflow-wrap:anywhere}
.sugg button:last-child{border-bottom:0}
.sugg .h{padding:10px 16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.stops{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.stops li{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:8px;padding:8px 0 8px 2px;border-bottom:1px solid var(--line)}
.stops .t{overflow-wrap:anywhere;font-weight:500}
.stops button{width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:50%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 12px var(--body);padding:11px 2px;border-radius:10px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--onaccent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;
  background:var(--accent);color:var(--onaccent);font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;cursor:pointer;padding:0 16px;text-align:center;
}
.btn:disabled{opacity:.6;cursor:default}
.status{margin:0;color:var(--muted);font-size:13px;min-height:1.4em}
.status.err{color:var(--ink);font-weight:600}
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:1000;display:grid;grid-template-columns:1fr 1fr;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:0 max(16px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-right, 0px));
}
.tabs button{position:relative;border:0;background:transparent;color:var(--muted);font:600 12px var(--body);letter-spacing:.16em;text-transform:uppercase;padding:20px 0 18px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--ink)}
.sum{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.sum .big{font:400 44px/1 var(--display)}
.sum .big small{font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.sum p{margin:0;color:var(--muted);font-size:13px;text-align:right}
ol.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.num{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 22px var(--display);cursor:pointer;display:grid;place-items:center;padding:0}
.row.home .num{background:var(--brass);border-color:var(--brass);color:var(--bg);font:700 13px var(--body)}
.txt{min-width:0}
.addr{font-weight:600;overflow-wrap:anywhere}
.leg{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.go{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);border-radius:50%;text-decoration:none}
.go svg{width:20px;height:20px}
.row.done .addr,.row.done .leg{opacity:.45}
.row.done .addr{text-decoration:line-through}
.row.done .num{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.maps{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);padding:40px 8px;text-align:center}
.empty b{display:block;font:400 26px var(--display);color:var(--ink);margin-bottom:4px}
.warn{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px}
.warn b{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><h1>Round</h1><span id="today"></span></header>

  <section id="mapTab" aria-label="Map and addresses">
    <div class="wrap" style="max-width:none">
      <div id="map" role="application" aria-label="Map"></div>

      <div class="field">
        <label class="label" for="add">Add addresses</label>
        <div class="addrow">
          <textarea id="add" rows="1" spellcheck="false" autocomplete="off" placeholder="Postcode or address. Paste a whole list if you like."></textarea>
          <button class="btn" id="addBtn" type="button">Add</button>
        </div>
        <div id="sugg" class="sugg" hidden></div>
        <p class="status" id="addStatus" aria-live="polite"></p>
      </div>

      <div class="field" id="stopsBox" hidden>
        <span class="label row2"><span id="stopCount"></span><button type="button" id="clear">Clear all</button></span>
        <ul class="stops" id="stops"></ul>
      </div>

      <div class="field">
        <label class="label" for="home">Home</label>
        <input type="text" id="home" autocomplete="off" placeholder="Home postcode">
      </div>

      <div class="field">
        <span class="label" id="t-order">Order</span>
        <div class="seg" role="radiogroup" aria-labelledby="t-order" id="mode">
          <button type="button" role="radio" data-m="out">Far → Home</button>
          <button type="button" role="radio" data-m="in">Home → Far</button>
          <button type="button" role="radio" data-m="loop">Loop</button>
          <button type="button" role="radio" data-m="here">From me</button>
        </div>
      </div>

      <button class="btn" id="go" type="button">Plan route</button>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="routeTab" hidden aria-label="Route order">
    <div id="routeBody"></div>
  </section>
</div>

<nav class="tabs" role="tablist" aria-label="Pages">
  <button role="tab" data-tab="map" aria-selected="true">Map</button>
  <button role="tab" data-tab="route" aria-selected="false">Route</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var KEY='round-planner-v2';
  var S={homeText:'Littlehampton, West Sussex',home:null,stops:[],mode:'out',plan:null,done:{},tab:'map'};
  try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

  /* ---------- network helpers (all free, no keys) ---------- */
  function getJSON(url,opts){
    var ctl=new AbortController(),t=setTimeout(function(){ctl.abort();},14000);
    opts=Object.assign({signal:ctl.signal},opts||{});
    return fetch(url,opts).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('http '+r.status);return r.json();},function(e){clearTimeout(t);throw e;});
  }
  var PC_RE=/\b([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})\b/i;
  function pcMatch(text){var m=String(text).match(PC_RE);return m?(m[1]+' '+m[2]).toUpperCase():null;}
  function areaName(r){return r.parish||r.admin_ward||r.admin_district||'';}
  function pcLookup(pc){
    return getJSON('https://api.postcodes.io/postcodes/'+encodeURIComponent(pc)).then(function(j){
      var r=j.result;return {lat:r.latitude,lng:r.longitude,area:areaName(r)};
    });
  }
  function pcBulk(list){
    return getJSON('https://api.postcodes.io/postcodes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postcodes:list})}).then(function(j){
      var out={};(j.result||[]).forEach(function(x){if(x&&x.result)out[x.query]={lat:x.result.latitude,lng:x.result.longitude,area:areaName(x.result)};});return out;
    });
  }
  var nomChain=Promise.resolve();
  function nominatim(q,limit){
    var job=nomChain.then(function(){
      var url='https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit='+(limit||5)+'&viewbox=-0.95,50.95,-0.15,50.65&q='+encodeURIComponent(q);
      return getJSON(url).then(function(a){return a.map(function(x){
        return {label:x.display_name.split(', ').slice(0,4).join(', '),lat:parseFloat(x.lat),lng:parseFloat(x.lon)};
      });});
    });
    nomChain=job.catch(function(){}).then(function(){return sleep(1150);});
    return job;
  }
  function hav(a,b){
    var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;
    var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)*Math.sin(dg/2);
    return 2*R*Math.asin(Math.sqrt(x));
  }

  /* ---------- map ---------- */
  var map=L.map('map',{zoomControl:false,attributionControl:true}).setView([50.81,-0.45],11);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
  var layer=L.layerGroup().addTo(map);
  function icon(txt,cls){var sm=cls==='sm';return L.divIcon({className:'',html:'<div class="pin '+(cls||'')+'">'+txt+'</div>',iconSize:sm?[14,14]:[28,28],iconAnchor:sm?[7,7]:[14,14]});}
  function drawMap(){
    layer.clearLayers();var pts=[];
    if(S.plan){
      var r=S.plan.route;
      if(S.plan.geometry&&S.plan.geometry.length){L.polyline(S.plan.geometry,{color:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#123F45',weight:4,opacity:.8}).addTo(layer);S.plan.geometry.forEach(function(p){pts.push(p);});}
      else{var line=r.map(function(n){return [n.lat,n.lng];});L.polyline(line,{color:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#123F45',weight:3,opacity:.7,dashArray:'6 6'}).addTo(layer);}
      var c=0,homeDone=false;
      r.forEach(function(n){
        pts.push([n.lat,n.lng]);
        if(n.kind==='stop'){c++;L.marker([n.lat,n.lng],{icon:icon(c)}).addTo(layer);}
        else if(!homeDone){homeDone=true;L.marker([n.lat,n.lng],{icon:icon(n.kind==='me'?'●':'H','home')}).addTo(layer);}
      });
    }else{
      S.stops.forEach(function(s){pts.push([s.lat,s.lng]);L.marker([s.lat,s.lng],{icon:icon('','sm')}).addTo(layer);});
      if(S.home&&S.home.text===S.homeText){pts.push([S.home.lat,S.home.lng]);L.marker([S.home.lat,S.home.lng],{icon:icon('H','home')}).addTo(layer);}
    }
    if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[34,34],maxZoom:15});
  }

  /* ---------- adding addresses ---------- */
  function setAdd(t,err){var s=$('addStatus');s.textContent=t||'';s.className='status'+(err?' err':'');}
  function setStatus(t,err){var s=$('status');s.textContent=t||'';s.className='status'+(err?' err':'');}
  function addStop(label,lat,lng){S.stops.push({label:label,lat:lat,lng:lng});S.plan=null;}
  function hideSugg(){var s=$('sugg');s.hidden=true;s.innerHTML='';}

  var acTimer=null;
  $('add').addEventListener('input',function(){
    var v=this.value.trim();clearTimeout(acTimer);
    this.style.height='auto';this.style.height=Math.min(this.scrollHeight,160)+'px';
    if(/^[A-Za-z]{1,2}\d[A-Za-z\d]?\s?\d?[A-Za-z]{0,2}$/.test(v)&&v.length>=3){
      acTimer=setTimeout(function(){
        getJSON('https://api.postcodes.io/postcodes/'+encodeURIComponent(v)+'/autocomplete').then(function(j){
          if($('add').value.trim()!==v)return;
          var list=(j.result||[]).slice(0,6);
          if(!list.length){hideSugg();return;}
          var box=$('sugg');box.innerHTML=list.map(function(p){return '<button type="button" data-pc="'+esc(p)+'">'+esc(p)+'</button>';}).join('');box.hidden=false;
        }).catch(hideSugg);
      },250);
    }else if(!$('sugg').querySelector('[data-pick]')){hideSugg();}
  });

  async function addFromInput(){
    var raw=$('add').value;
    var lines=raw.split('\n').map(function(s){return s.replace(/^\s*(\d+[.)]\s+|[-•*]\s+)/,'').trim();}).filter(Boolean);
    hideSugg();
    if(!lines.length){setAdd('Type a postcode or address first.',true);return;}
    var btn=$('addBtn');btn.disabled=true;setAdd('Finding…');
    try{
      if(lines.length===1&&!pcMatch(lines[0])){
        var res=await nominatim(lines[0],5);
        if(!res.length){setAdd('Nothing found. Try adding the town or a postcode.',true);return;}
        var box=$('sugg');
        box.innerHTML='<div class="h">Tap the right one</div>'+res.map(function(x,k){return '<button type="button" data-pick="'+k+'">'+esc(x.label)+'</button>';}).join('');
        box.hidden=false;box._res=res;setAdd('');return;
      }
      var pcs=[];lines.forEach(function(l){var p=pcMatch(l);if(p)pcs.push(p);});
      var found={};
      if(pcs.length){try{found=await pcBulk(pcs.filter(function(p,i){return pcs.indexOf(p)===i;}));}catch(e){}}
      var failed=[],added=0;
      for(var i=0;i<lines.length;i++){
        var l=lines[i],p=pcMatch(l);
        if(p){
          var hit=found[p];
          if(!hit){try{hit=await pcLookup(p);}catch(e){hit=null;}}
          if(hit){addStop(pcMatch(l)===l.toUpperCase().replace(/\s+/g,' ').trim()?(p+(hit.area?' · '+hit.area:'')):l,hit.lat,hit.lng);added++;}else failed.push(l);
        }else{
          setAdd('Finding '+(i+1)+' of '+lines.length+'…');
          try{var r=await nominatim(l,1);if(r[0]){addStop(l,r[0].lat,r[0].lng);added++;}else failed.push(l);}catch(e){failed.push(l);}
        }
      }
      $('add').value='';$('add').style.height='auto';save();renderStops();drawMap();
      setAdd(added+' added.'+(failed.length?' Not found: '+failed.join('; ')+'.':''),failed.length>0&&!added);
    }catch(e){setAdd('Could not reach the lookup service. Check your signal and try again.',true);}
    finally{btn.disabled=false;}
  }
  $('addBtn').addEventListener('click',addFromInput);
  $('add').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&this.value.indexOf('\n')<0){e.preventDefault();addFromInput();}});
  $('sugg').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.pc){
      var typed=$('add').value.trim();$('add').value=b.dataset.pc;hideSugg();$('add').focus();return;
    }
    if(b.dataset.pick!==undefined){
      var x=this._res[+b.dataset.pick];addStop(x.label,x.lat,x.lng);
      $('add').value='';hideSugg();save();renderStops();drawMap();setAdd('Added.');
    }
  });

  function renderStops(){
    var box=$('stopsBox');box.hidden=!S.stops.length;
    $('stopCount').textContent=S.stops.length+(S.stops.length===1?' stop':' stops');
    $('stops').innerHTML=S.stops.map(function(s,k){return '<li><span class="t">'+esc(s.label)+'</span><button type="button" data-rm="'+k+'" aria-label="Remove '+esc(s.label)+'">×</button></li>';}).join('');
  }
  $('stops').addEventListener('click',function(e){
    var b=e.target.closest('button[data-rm]');if(!b)return;
    S.stops.splice(+b.dataset.rm,1);S.plan=null;save();renderStops();renderRoute();drawMap();
  });
  $('clear').addEventListener('click',function(){S.stops=[];S.plan=null;S.done={};save();renderStops();renderRoute();drawMap();setAdd('');setStatus('');});

  /* ---------- ordering ---------- */
  var seed=20261106;
  function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
  function cost(p){var c=0;for(var i=1;i<p.length;i++)c+=hav(p[i-1],p[i]);return c;}
  function twoOpt(p){
    var imp=true;
    while(imp){imp=false;
      for(var i=1;i<p.length-2;i++){for(var j=i+1;j<p.length-1;j++){
        var a=hav(p[i-1],p[i])+hav(p[j],p[j+1]),b=hav(p[i-1],p[j])+hav(p[i],p[j+1]);
        if(b<a-1e-9){var seg=p.slice(i,j+1).reverse();Array.prototype.splice.apply(p,[i,seg.length].concat(seg));imp=true;}
      }}
    }
    return p;
  }
  function solveLocal(start,end,items){
    var tries=[],rem=items.slice(),cur=start,order=[];
    while(rem.length){var bi=0,bd=Infinity;rem.forEach(function(r,k){var x=hav(cur,r);if(x<bd){bd=x;bi=k;}});cur=rem.splice(bi,1)[0];order.push(cur);}
    tries.push(order);
    for(var t=0;t<40;t++){var a=items.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}tries.push(a);}
    var best=null,bc=Infinity;
    tries.forEach(function(o){var p=twoOpt([start].concat(o,end?[end]:[])),c=cost(p);if(c<bc-1e-9){bc=c;best=p;}});
    return best;
  }

  function getHere(){
    return new Promise(function(res,rej){
      if(!navigator.geolocation){rej(new Error('nogeo'));return;}
      navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude});},function(e){rej(e);},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
    });
  }
  async function resolveHome(){
    var t=$('home').value.trim();S.homeText=t;
    if(!t)return null;
    if(S.home&&S.home.text===t)return S.home;
    var pc=pcMatch(t),h=null;
    if(pc){try{var r=await pcLookup(pc);h={text:t,lat:r.lat,lng:r.lng};}catch(e){}}
    if(!h){var n=await nominatim(t,1);if(n[0])h={text:t,lat:n[0].lat,lng:n[0].lng};}
    S.home=h;return h;
  }

  async function planRoute(){
    var btn=$('go');
    if(!S.stops.length){setStatus('Add at least one address first.',true);return;}
    btn.disabled=true;btn.textContent='Planning…';setStatus('');
    try{
      var start,startKind;
      if(S.mode==='here'){
        setStatus('Getting your location…');
        try{var me=await getHere();start={lat:me.lat,lng:me.lng,label:'Your location'};startKind='me';}
        catch(e){setStatus('Could not get your location. Allow location for this site, or pick another order.',true);return;}
      }else{
        var h=await resolveHome();
        if(!h){setStatus('Could not find your home address. Try a full postcode.',true);return;}
        start={lat:h.lat,lng:h.lng,label:h.text};startKind='home';
      }
      setStatus('Working out the best order…');
      var stops=S.stops.map(function(s){return {kind:'stop',label:s.label,lat:s.lat,lng:s.lng};});
      var H={kind:startKind,label:start.label,lat:start.lat,lng:start.lng};
      var seq,params,roundtrip=false,endsAtStart=false;
      if(S.mode==='out'||S.mode==='in'){
        var far=stops[0];stops.forEach(function(s){if(hav(H,s)>hav(H,far))far=s;});
        var others=stops.filter(function(s){return s!==far;});
        if(S.mode==='out'){seq=[far].concat(others,[H]);}else{seq=[H].concat(others,[far]);}
        params='roundtrip=false&source=first&destination=last';
      }else if(S.mode==='loop'){seq=[H].concat(stops);params='roundtrip=true&source=first';roundtrip=true;endsAtStart=true;}
      else{seq=[H].concat(stops);params='roundtrip=false&source=first&destination=any';}

      var ordered=null,legs=null,geometry=null,est=false;
      if(seq.length>2||roundtrip){
        try{
          var coords=seq.map(function(n){return n.lng.toFixed(6)+','+n.lat.toFixed(6);}).join(';');
          var j=await getJSON('https://router.project-osrm.org/trip/v1/driving/'+coords+'?'+params+'&geometries=geojson&overview=full');
          if(j.code!=='Ok'||!j.trips||!j.trips[0])throw new Error('osrm');
          var wp=j.waypoints.map(function(w,i){return {i:i,pos:w.waypoint_index};}).sort(function(a,b){return a.pos-b.pos;});
          ordered=wp.map(function(w){return seq[w.i];});
          legs=j.trips[0].legs.map(function(l){return {mi:l.distance/1609.34,min:l.duration/60};});
          geometry=j.trips[0].geometry.coordinates.map(function(c){return [c[1],c[0]];});
          if(endsAtStart)ordered=ordered.concat([H]);
        }catch(e){ordered=null;}
      }
      if(!ordered){
        est=true;
        if(S.mode==='out'){ordered=solveLocal(seq[0],H,seq.slice(1,-1));}
        else if(S.mode==='in'){ordered=solveLocal(H,seq[seq.length-1],seq.slice(1,-1));}
        else if(S.mode==='loop'){ordered=solveLocal(H,H,stops);}
        else{ordered=solveLocal(H,null,stops);}
        legs=[];for(var k=1;k<ordered.length;k++){var mi=hav(ordered[k-1],ordered[k])*0.621371*1.3;legs.push({mi:mi,min:mi/25*60});}
        geometry=null;
      }
      var tm=0,tt=0;
      var route=ordered.map(function(n,k){
        var lg=k?legs[k-1]:null;if(lg){tm+=lg.mi;tt+=lg.min;}
        return {kind:n.kind,label:n.label,lat:n.lat,lng:n.lng,mi:lg?lg.mi:0,min:lg?lg.min:0};
      });
      S.plan={mode:S.mode,route:route,totalMi:tm,totalMin:tt,est:est,geometry:geometry,stops:stops.length};
      S.done={};save();
      renderRoute();drawMap();
      setStatus(est?'Route planned using straight-line estimates, because the road routing service did not answer.':'');
      switchTab('route');
    }catch(e){
      setStatus('Could not plan the route. Check your signal and try again.',true);
    }finally{btn.disabled=false;btn.textContent='Plan route';}
  }

  /* ---------- route page ---------- */
  function ptStr(n){return n.kind==='stop'&&pcMatch(n.label)?n.label:n.lat.toFixed(6)+','+n.lng.toFixed(6);}
  function mapsLinks(route){
    var pts=route.map(ptStr),q=encodeURIComponent,parts=[],i=0;
    if(pts.length<2)return parts;
    while(i<pts.length-1){
      var end=Math.min(i+9,pts.length-1),seg=pts.slice(i,end+1);
      var url='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+q(seg[0])+'&destination='+q(seg[seg.length-1]);
      if(seg.length>2)url+='&waypoints='+seg.slice(1,-1).map(q).join('%7C');
      parts.push(url);i=end;
    }
    return parts;
  }
  var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  function fmtTime(m){var h=Math.floor(m/60),mm=Math.round(m%60);return h?h+' h '+(mm<10?'0':'')+mm+' min':mm+' min';}
  function renderRoute(){
    var el=$('routeBody');
    if(!S.plan){el.innerHTML='<div class="empty"><b>No route yet</b>Add your addresses and plan a round. The order shows up here.</div>';return;}
    var r=S.plan.route,c=0,parts=mapsLinks(r),html='<div class="wrap" style="max-width:none">';
    html+='<div class="sum"><div class="big">'+S.plan.stops+'<small>stops</small></div><p>about '+Math.round(S.plan.totalMi)+' mi<br>'+fmtTime(S.plan.totalMin)+' driving'+(S.plan.est?' (est.)':'')+'</p></div>';
    html+='<div class="maps">';
    parts.forEach(function(u,k){html+='<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">'+(parts.length===1?'Open in Google Maps':'Google Maps · Part '+(k+1)+' of '+parts.length)+'</a>';});
    html+='</div><ol class="list">';
    r.forEach(function(n,k){
      var key=n.label+'#'+k,tag,leg;
      if(n.kind==='stop'){c++;tag=c;}else tag=n.kind==='me'?'●':'H';
      if(k===0)leg=n.kind==='stop'?'First stop':'Start';
      else leg=(n.mi<0.1?'Next door':n.mi.toFixed(1)+' mi')+' · '+Math.max(1,Math.round(n.min))+' min'+(n.kind!=='stop'?' · Finish':'');
      var nav='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(ptStr(n));
      html+='<li class="row'+(n.kind!=='stop'?' home':'')+(S.done[key]?' done':'')+'">'+
        '<button class="num" type="button" data-key="'+esc(key)+'" aria-pressed="'+(S.done[key]?'true':'false')+'" aria-label="'+(n.kind==='stop'?'Stop '+tag:'Home')+', tap to mark done">'+tag+'</button>'+
        '<div class="txt"><div class="addr">'+esc(n.label)+'</div><div class="leg">'+esc(leg)+'</div></div>'+
        '<a class="go" href="'+esc(nav)+'" target="_blank" rel="noopener" aria-label="Navigate to '+esc(n.label)+'">'+ARROW+'</a></li>';
    });
    html+='</ol></div>';
    el.innerHTML=html;
  }
  $('routeBody').addEventListener('click',function(e){var b=e.target.closest('.num');if(!b)return;var k=b.dataset.key;S.done[k]=!S.done[k];save();renderRoute();});

  /* ---------- tabs, modes, startup ---------- */
  function switchTab(t){
    S.tab=t;save();
    $('mapTab').hidden=t!=='map';$('routeTab').hidden=t!=='route';
    document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false');});
    if(t==='map')setTimeout(function(){map.invalidateSize();drawMap();},30);
    window.scrollTo(0,0);
  }
  function setMode(m){
    S.mode=m;
    document.querySelectorAll('#mode button').forEach(function(b){b.setAttribute('aria-checked',b.dataset.m===m?'true':'false');});
    save();
  }
  $('mode').addEventListener('click',function(e){var b=e.target.closest('button');if(b){setMode(b.dataset.m);}});
  document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)switchTab(b.dataset.tab);});
  $('go').addEventListener('click',planRoute);
  $('home').addEventListener('input',function(){S.homeText=this.value;save();});

  $('home').value=S.homeText||'';
  setMode(S.mode||'out');
  try{$('today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});}catch(e){}
  renderStops();renderRoute();
  switchTab(S.plan&&S.tab==='route'?'route':'map');
})();
</script>
